name: publish

# Publishes to PyPI with trusted publishing (OIDC) when a v* tag is pushed.
# No API token is stored. One-time setup on pypi.org: add a pending publisher
# for project "leakmap" (owner trakshan-mishra, repo leakmap, workflow
# publish.yml, environment pypi).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.21"
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv build
      - name: Tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import leakmap; print(leakmap.__version__)')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
