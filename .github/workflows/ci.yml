name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * 1"  # weekly, so new advisories show up without a push
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.21"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.21"
      - run: uvx ruff@0.17.3 check leakmap tests benchmark
      - run: uv sync --locked --extra dev
      - run: uv run mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.21"
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv pip check
      - run: uv export --locked --format requirements-txt --no-emit-project --all-extras -o requirements.lock.txt
      # tornado advisories are accepted until mitmproxy allows 6.6; see SECURITY.md.
      - run: >-
          uvx pip-audit@2.10.1 -r requirements.lock.txt --disable-pip --require-hashes
          --ignore-vuln CVE-2026-116577
          --ignore-vuln CVE-2026-115927
          --ignore-vuln CVE-2026-116578
      # torch comes from the PyTorch CPU index, which pip-audit cannot look up; ask OSV directly.
      - name: torch advisories (OSV)
        run: |
          v=$(grep -A1 '^name = "torch"' uv.lock | sed -n 's/^version = "\([^"+]*\).*/\1/p' | head -1)
          curl -sf https://api.osv.dev/v1/query -d "{\"package\":{\"name\":\"torch\",\"ecosystem\":\"PyPI\"},\"version\":\"$v\"}" \
            | python3 -c "import json,sys; v=[x['id'] for x in json.load(sys.stdin).get('vulns',[])]; print('torch', '$v', v or 'no advisories'); sys.exit(bool(v))"
