[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakmap"
version = "0.1.0"
description = "See what personal data your app sends to third parties, and fail CI when a new flow appears."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Trakshan Mishra" }]
keywords = ["privacy", "dpdp", "gdpr", "pii", "llm", "ci", "data-flow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mitmproxy>=11.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
leakmap = "leakmap.cli:main"

[project.urls]
Homepage = "https://github.com/trakshan-mishra/leakmap"

[tool.hatch.build.targets.wheel]
packages = ["leakmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
