[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakmap"
version = "0.1.0"
description = "See what personal data your app sends to third parties, and fail CI when a new flow appears."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Trakshan Mishra" }]
keywords = ["privacy", "dpdp", "gdpr", "pii", "llm", "ci", "data-flow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mitmproxy>=11.0", "phonenumbers>=9.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ner = ["gliner>=0.2.29", "torch>=2.4", "protobuf>=5"]

[project.scripts]
leakmap = "leakmap.cli:main"

[project.urls]
Homepage = "https://github.com/trakshan-mishra/leakmap"

[tool.hatch.build.targets.wheel]
packages = ["leakmap"]

# torch from the CPU-only index: the default Linux wheel pulls in ~2 GB of CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# ruff's long-standing default set; pinned so ruff upgrades don't change what CI enforces.
select = ["E4", "E7", "E9", "F"]
